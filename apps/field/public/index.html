<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#166534"><title>LVSP Field</title><link rel="manifest" href="/field/manifest.webmanifest"><link rel="icon" href="/field/icons/icon-192.png"><link rel="apple-touch-icon" href="/field/icons/icon-192.png"><style>
*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans Lao";margin:0;background:#f1f5f9;color:#172033}header{background:#0b3a2b;color:white;padding:16px;position:sticky;top:0;z-index:2}.head{max-width:760px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:18px;margin:0}.head p{font-size:12px;margin:3px 0 0;opacity:.8}.head-actions{display:flex;gap:7px;align-items:center}.status{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 8px;font-size:11px}.status.offline{background:#9a3412}.status.online{background:#166534}main{max-width:760px;margin:auto;padding:16px}.card,article{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px}.auth{font-size:12px;background:#ecfdf5;border-color:#bbf7d0}.auth a{color:#166534}label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}button{background:#166534;color:white;border:0;border-radius:9px;padding:10px 13px;margin-top:10px;font-weight:700;cursor:pointer}button.secondary{background:#475569}button.install{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);margin:0}button:disabled{opacity:.5}.row{display:flex;justify-content:space-between;gap:10px}.row span{font-size:10px;border-radius:999px;background:#f1f5f9;padding:3px 7px}.empty{color:#64748b}small{color:#64748b}article p{white-space:pre-wrap}article em{display:block;color:#b91c1c;font-size:11px;margin-top:5px}article.synced{opacity:.66}.remove{background:none;color:#64748b;border:0;padding:0;margin-top:8px;font-size:11px}.syncbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.syncbar h3{margin:0}.syncbar button{margin:0}.message{font-size:12px;color:#475569;min-height:18px}.help{font-size:12px;color:#64748b;line-height:1.5}
</style></head><body><header><div class="head"><div><h1>LVSP Field</h1><p>Offline-first field capture · ເກັບຂໍ້ມູນໜ້າວຽກແບບ Offline</p></div><div class="head-actions"><span id="network-state" class="status">Online</span><button id="install-btn" class="install" hidden>Install</button></div></div></header><main><section id="auth-state" class="card auth"></section><section class="card"><form id="field-form"><label>Capture type / ປະເພດບັນທຶກ</label><select name="captureType"><option value="INSPECTION_NOTE">Inspection note</option><option value="DISEASE_FIELD_NOTE">Disease field note</option><option value="SAMPLE_NOTE">Sample collection note</option><option value="BORDER_NOTE">Border inspection note</option></select><label>Facility / ສະຖານປະກອບການ</label><input name="facility" required><label>Finding / Note / ຂໍ້ກວດພົບ</label><textarea name="finding" rows="5" required></textarea><label>GPS</label><input name="gps" placeholder="17.9757, 102.6331"><button type="button" id="gps" class="secondary">Capture GPS</button><br><button type="submit">Save Offline Draft</button></form><p class="help">Saved data stays on this device until Sync. Synced records enter an LVSP staging queue and do not become an official inspection finding automatically.</p><div id="message" class="message"></div></section><div class="syncbar"><h3>Offline queue · <span id="pending-count">0</span> pending</h3><button id="sync-btn">Sync now</button></div><section id="queue"></section></main><script type="module" src="app.js"></script></body></html>
