components:
  securitySchemes:
    lvspBearer:
      type: http
      scheme: bearer
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://example.invalid/.well-known/openid-configuration
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
  responses:
    Conflict:
      description: Business state conflict
    Forbidden:
      description: Authorization denied
    ValidationError:
      description: Validation failed
